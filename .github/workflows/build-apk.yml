name: Construir APK de Couch Fit

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Copiar tipografías (Outfit y Nunito) para uso sin internet
        run: |
          mkdir -p www/fonts
          for w in 400 600 700 800; do cp node_modules/@fontsource/nunito/files/nunito-latin-$w-normal.woff2 www/fonts/; done
          for w in 500 600 700; do cp node_modules/@fontsource/outfit/files/outfit-latin-$w-normal.woff2 www/fonts/; done

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Poner el ícono de Couch Fit
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/mipmap-$d/*.png $RES/mipmap-$d/
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#C75718</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CouchFit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

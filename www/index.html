<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E4">
<title>Couch Fit</title>
<style>
@font-face{font-family:'Nunito';font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:600;font-display:swap;src:url(fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:700;font-display:swap;src:url(fonts/outfit-latin-700-normal.woff2) format('woff2')}
:root{
  /* Diseño: columna móvil de 560px, mapa muscular como protagonista, barra de pestañas inferior */
  --orange:#E8702A;
  --orange-btn:#C75718;
  --orange-lt:#FBE3CF;
  --bone:#F6F0E4;
  --paper:#FFFBF2;
  --line:#E5D9C6;
  --brown:#7A5A42;
  --brown-dk:#3D2A1D;
  --brown-lt:#D8C7B0;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bone);color:var(--brown-dk);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--brown-dk)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:16px 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--orange);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.hello{font-size:15px;color:var(--brown)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:4px}
.card .sub{margin:0 0 12px;color:var(--brown);font-size:14.5px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font:700 13px var(--display);margin-right:8px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--brown-lt);background:transparent;border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:600;color:var(--brown)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.fixed{opacity:.75;cursor:default}
.chip.x::after{content:" ×";font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bone);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--brown)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--brown);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font:700 17px var(--display);background:var(--orange-btn);color:#fff;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--orange-btn);border:2px solid var(--orange-btn)}
.btn.soft{background:var(--orange-lt);color:var(--brown-dk)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14.5px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
/* mapa */
.mapwrap{display:grid;grid-template-columns:1fr;justify-items:center;gap:10px}
.fig{width:100%;max-width:210px;height:auto;display:block}
.fig .sil *{fill:#EBDFCB}
.fig .m{fill:#D9C4A5;stroke:var(--paper);stroke-width:1.4;transition:fill .15s}
.fig.inter .m{cursor:pointer}
.fig.inter .m:hover{fill:#F2B88F}
.fig .m.sel,.fig .m.p{fill:var(--orange)}
.fig .m.s{fill:#F5C49E}
.fig.sm{max-width:92px}
.sel-note{min-height:22px;text-align:center;font-size:14.5px;color:var(--brown)}
.today{background:var(--orange-lt);border-color:#F1C6A3}
.today p{margin:2px 0 10px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--bone);border:1px solid var(--line);color:var(--brown)}
.tag.o{background:var(--orange-lt);border-color:#F1C6A3;color:#8A3E0D}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.li{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;width:100%}
.li h3{font-size:16.5px;margin-bottom:4px}
.li .meta{font-size:13.5px;color:var(--brown)}
.rx{font:700 15px var(--display);color:var(--orange-btn);white-space:nowrap}
.search{width:100%;border:1.5px solid var(--brown-lt);border-radius:12px;padding:11px 14px;background:var(--paper)}
.field{width:100%;border:1.5px solid var(--brown-lt);border-radius:12px;padding:10px 12px;background:var(--paper)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fl label{display:block;font-size:13px;font-weight:700;color:var(--brown);margin-bottom:4px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{font:700 15px var(--display);color:var(--brown)}
.day.hoy .dn{color:var(--orange-btn)}
.day .nm{font-weight:800}
.day .ms{font-size:13px;color:var(--brown)}
.day .rest{color:var(--brown);font-style:italic}
.bar{height:10px;background:var(--bone);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange)}
.goal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.goal input[type=checkbox]{width:22px;height:22px;accent-color:var(--orange-btn)}
.goal.done span{text-decoration:line-through;color:var(--brown)}
.goal span{flex:1}
.ibtn{border:0;background:transparent;color:var(--brown);font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
/* barra inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;background:transparent;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:10.5px;letter-spacing:-.01em;white-space:nowrap;color:var(--brown)}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--orange-btn)}
/* capas */
.layer{position:fixed;inset:0;background:var(--bone);overflow:auto;-webkit-overflow-scrolling:touch}
.layer.sheet{background:rgba(61,42,29,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bone);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
.page{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.bar-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px}
.steps{padding-left:22px;margin:8px 0 12px}
.steps li{margin-bottom:8px}
.tipbox{background:var(--orange-lt);border-radius:12px;padding:10px 12px;font-size:14.5px}
.setrow{display:flex;gap:8px;flex-wrap:wrap}
.setbtn{flex:1;min-width:76px;border:2px solid var(--brown-lt);background:var(--paper);border-radius:14px;padding:14px 8px;font:700 16px var(--display);color:var(--brown)}
.setbtn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.timer{font:700 54px var(--display);text-align:center;color:var(--orange-btn);font-variant-numeric:tabular-nums}
.big{font:700 26px var(--display)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--brown-lt)}
.dots i.on{background:var(--orange)}
.dots i.cur{outline:2px solid var(--orange);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--brown-dk);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:60;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{color:var(--brown);text-align:center;padding:18px 6px}

.chip.pre{border-color:var(--orange);color:var(--orange-btn)}
.chip.pre[aria-pressed="true"]{color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pair>div{display:flex;flex-direction:column;align-items:center}
.pair .fig{max-width:200px}
.cap{font:700 13px var(--display);color:var(--brown);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.thumb{flex:none;width:60px;height:60px;border-radius:50%;background:#F1E8D7;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.thumb .fig{width:100%;max-width:none;height:100%}
.grp{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.grp:first-of-type{border-top:0}
.gn{flex:1;font:700 18px var(--display);text-transform:uppercase;letter-spacing:.02em}
.cnt{font-size:13px;color:var(--brown)}
.chev{color:var(--orange-btn);font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:12px;font-weight:800;color:var(--brown)}
.cd{border:1.5px solid transparent;background:transparent;border-radius:10px;aspect-ratio:1;font-weight:700;color:var(--brown-dk);position:relative;padding:0}
.cd.has{background:var(--orange-lt)}
.cd.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange-btn)}
.cd.tod{border-color:var(--brown-lt)}
.cd.sel{background:var(--orange);color:#fff}
.cd.sel::after{background:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.tile b{display:block;font:700 26px var(--display);color:var(--orange-btn);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--brown)}
.ch text{fill:var(--brown);font:600 11px var(--body)}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-of-type{border-top:0}

.ord{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--orange-btn);font:800 11px var(--display);margin-right:6px}
.rhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:14px;font:inherit}
.rhead b{display:block;font:700 17px var(--display)}
.rhead .meta{display:block;font-size:13.5px;color:var(--brown)}
.demo{background:#F1E8D7;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.demo .fig{max-width:230px;max-height:300px;width:auto;height:300px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--brown)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.dot.p{background:var(--orange)}.dot.s{background:#EDB07F}
.stepsbig{list-style:none;counter-reset:s;padding:0;margin:10px 0 14px}
.stepsbig li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.stepsbig li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 14px var(--display)}
.stepsbig li span{padding-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Secciones"></nav>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= Datos ================= */
const MUS={pecho:'Pecho',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',antebrazos:'Antebrazos',abdomen:'Abdomen',oblicuos:'Oblicuos',cuadriceps:'Cuádriceps',trapecio:'Trapecio',espalda:'Espalda',lumbar:'Zona lumbar',gluteos:'Glúteos',isquios:'Isquiotibiales',pantorrillas:'Pantorrillas'};
const MK=Object.keys(MUS);
const EQ={cuerpo:'Peso corporal',cuerda:'Cuerda de saltar',banda:'Bandas elásticas',anillas:'Anillas o TRX',pelota:'Pelota suiza',rueda:'Rueda abdominal',balon:'Balón medicinal',step:'Step o cajón',mancuernas:'Mancuernas',kettlebell:'Kettlebell',barra:'Barra con discos',barraz:'Barra Z',banco:'Banco',dominadas:'Barra de dominadas',paralelas:'Paralelas o barras de fondos',polea:'Poleas',maquina:'Máquinas guiadas',rack:'Rack o soportes'};
const EQLIST=['mancuernas','banda','barra','banco','rack','dominadas','paralelas','kettlebell','cuerda','step','pelota','rueda','balon','anillas','barraz','polea','maquina'];
const LIM={rodillas:'Rodillas sensibles',lumbar:'Espalda baja',hombros:'Hombros sensibles',munecas:'Muñecas sensibles'};
const LV=['Principiante','Intermedio','Avanzado'];
const GOALS={
  musculo:{n:'Ganar músculo',sets:3,reps:'8-12',rest:75,tip:'Sube el peso o las repeticiones poco a poco cada semana y duerme bien.'},
  grasa:{n:'Perder grasa',sets:3,reps:'12-15',rest:45,tip:'Descansa poco entre series y suma caminatas en los días libres.'},
  fuerza:{n:'Ganar fuerza',sets:4,reps:'5-6',rest:120,tip:'Prioriza la técnica y descansa lo suficiente entre series pesadas.'},
  tonificar:{n:'Tonificar y resistencia',sets:3,reps:'12-15',rest:45,tip:'Mantén el ritmo constante y busca terminar cada serie con control.'},
  salud:{n:'Salud general',sets:3,reps:'10-12',rest:60,tip:'La constancia pesa más que la intensidad: apunta a no faltar.'}
};
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const FRONT_ONLY=['pecho','biceps','abdomen','oblicuos','cuadriceps'];
const BACK_ONLY=['espalda','lumbar','gluteos','isquios','triceps','trapecio'];
const CORE=['abdomen','oblicuos','lumbar'];

/* id, nombre, músculo principal, secundarios, equipo, nivel, modo (r=repeticiones, t=tiempo), evitar si..., pasos, consejo, vista */
const X=(id,n,p,s,eq,lv,mode,avoid,steps,tip,view)=>({id,n,p,s,eq,lv,mode,avoid,steps:steps.split('|'),tip,view:view||(BACK_ONLY.includes(p)?'back':'front')});
const EX=[
X('flexiones','Flexiones','pecho',['triceps','hombros'],['cuerpo'],1,'r',['munecas'],"Apoya las manos un poco más abiertas que los hombros y forma una línea recta de cabeza a talones.|Baja el pecho hasta quedar a un puño del suelo, con los codos a unos 45° del cuerpo.|Empuja el suelo hasta estirar los brazos sin hundir la cadera.","Si aún no puedes, apoya las manos en una mesa firme para reducir la carga."),
X('flexiones-elevadas','Flexiones con manos elevadas','pecho',['triceps'],['cuerpo'],1,'r',[],"Coloca las manos sobre un sillón o escalón estable, con el cuerpo en diagonal.|Baja el pecho hacia el borde manteniendo el abdomen firme.|Sube estirando los brazos sin encoger los hombros.","Cuanto más alto el apoyo, más fácil. Ve bajando la altura con las semanas."),
X('press-suelo','Press de pecho en el suelo con mancuernas','pecho',['triceps','hombros'],['mancuernas'],1,'r',[],"Tumbado boca arriba, con las rodillas dobladas, sostén una mancuerna en cada mano a la altura del pecho.|Empuja hacia arriba hasta estirar los brazos sin bloquear los codos.|Baja despacio hasta que los codos rocen el suelo.","El suelo frena el recorrido y protege tus hombros."),
X('press-mancuernas','Press de pecho con mancuernas en banco','pecho',['triceps','hombros'],['mancuernas','banco'],2,'r',['hombros'],"Acuéstate en el banco con los pies firmes y las mancuernas sobre el pecho.|Baja hasta sentir un estiramiento cómodo en el pecho, con los codos algo cerrados.|Empuja hacia arriba juntando ligeramente las mancuernas.","Mantén los omóplatos juntos y apoyados en el banco todo el tiempo."),
X('press-banca','Press de banca con barra','pecho',['triceps','hombros'],['barra','banco','rack'],3,'r',['hombros'],"Agarra la barra un poco más abierto que los hombros y descuélgala con los brazos estirados.|Baja controlado hasta rozar la parte media del pecho.|Empuja en línea recta hacia arriba sin despegar la espalda del banco.","Pide a alguien que te asista cuando uses mucho peso."),
X('aperturas','Aperturas con mancuernas','pecho',['hombros'],['mancuernas','banco'],2,'r',['hombros'],"Acostado en el banco, sostén las mancuernas arriba con los codos ligeramente doblados.|Abre los brazos hacia los lados como si abrazaras un barril.|Cierra juntando las manos sobre el pecho, sin chocar las pesas.","Usa menos peso que en el press: aquí manda el estiramiento."),
X('cruce-poleas','Cruce de poleas','pecho',['hombros'],['polea'],2,'r',[],"Sujeta una manija en cada polea alta y da un paso al frente con el torso ligeramente inclinado.|Cierra los brazos hacia el centro con los codos suaves.|Vuelve despacio hasta sentir el estiramiento del pecho.","Imagina que juntas los codos, no las manos."),
X('press-maquina-pecho','Press de pecho en máquina','pecho',['triceps'],['maquina'],1,'r',[],"Ajusta el asiento para que las manijas queden a la altura del pecho.|Empuja hasta estirar los brazos sin bloquear los codos.|Regresa sin soltar el peso de golpe.","Es ideal para aprender el movimiento con seguridad."),
X('press-banda','Press de pecho con banda','pecho',['triceps','hombros'],['banda'],1,'r',[],"Pasa la banda por la espalda y sujeta los extremos a la altura del pecho.|Empuja al frente hasta estirar los brazos.|Vuelve despacio manteniendo la tensión.","Da un paso al frente para aumentar la resistencia."),
X('press-militar','Press militar con mancuernas','hombros',['triceps'],['mancuernas'],2,'r',['hombros'],"De pie o sentado, lleva las mancuernas a la altura de las orejas con las palmas al frente.|Empuja hacia arriba hasta estirar los brazos sobre la cabeza.|Baja controlado hasta la altura de las orejas.","Aprieta el abdomen para no arquear la espalda."),
X('elev-laterales','Elevaciones laterales','hombros',[],['mancuernas'],1,'r',[],"De pie, con una mancuerna en cada mano a los lados y los codos suaves.|Eleva los brazos hacia los lados hasta la altura de los hombros.|Baja despacio sin balancear el torso.","Usa poco peso: se trabaja mejor con control que con impulso."),
X('elev-laterales-banda','Elevaciones laterales con banda','hombros',[],['banda'],1,'r',[],"Pisa la banda con ambos pies y sujeta los extremos.|Eleva los brazos hacia los lados hasta la altura de los hombros.|Baja lento resistiendo la banda.","Si la banda es muy suave, pisa más cerca de un extremo."),
X('pajaros','Pájaros para hombro posterior','hombros',['trapecio'],['mancuernas'],2,'r',[],"Inclina el torso al frente con la espalda recta y las mancuernas colgando.|Abre los brazos hacia los lados apretando los omóplatos.|Baja sin perder la postura.","Mira al suelo para mantener el cuello alineado.",'back'),
X('pike','Flexiones en V (pike)','hombros',['triceps'],['cuerpo'],2,'r',['hombros','munecas'],"Forma una V invertida con la cadera alta y las manos en el suelo.|Dobla los codos llevando la cabeza hacia el suelo, entre las manos.|Empuja hasta volver arriba.","Acerca los pies a las manos para que sea más difícil."),

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function usable(ex){const o=owned();return ex.eq.every(e=>o.has(e))&&!ex.avoid.some(a=>S.p.limits.indexOf(a)>-1)}
function cands(m,used){
  const lv=+S.p.level+1;
  let l=EX.filter(e=>e.p===m&&usable(e)&&!used.has(e.id)&&e.lv<=lv);
  if(!l.length)l=EX.filter(e=>e.s.indexOf(m)>-1&&usable(e)&&!used.has(e.id)&&e.lv<=lv);
  return l.map(e=>({e,k:e.lv+Math.random()*1.6})).sort((a,b)=>b.k-a.k).map(x=>x.e);
}
function goalKey(){return (S.p.objs&&S.p.objs[0])||'musculo'}
function rx(ex,gk){
  const g=GOALS[gk||goalKey()]||GOALS.musculo;
  if(ex.mode==='t')return{sets:3,reps:[30,40,50][ex.lv-1]+' s',rest:45};
  return{sets:g.sets,reps:g.reps,rest:g.rest};
}
function mk(ex,target,gk){return Object.assign({id:ex.id,target},rx(ex,gk))}
function lastTrained(){

}
function autoMuscles(){
  const day=S.plan&&S.plan[todayIdx()];
  if(day&&day.muscles&&day.muscles.length)return{m:day.muscles.slice(),why:`Hoy toca "${day.name}" en tu plan semanal.`,title:day.name};
  const t=lastTrained();
  const cnt=S.p.minutes<=20?2:S.p.minutes>=60?4:3;
  const pool=MK.filter(x=>cands(x,new Set()).length>0);const m=shuffle(pool.length?pool:MK).sort((a,b)=>t[a]-t[b]).slice(0,cnt);
  return{m,why:'Elegí lo que llevas más tiempo sin trabajar.',title:'Entrenamiento sugerido'};
}
function buildSession(muscles,title,why){
  let a=null;
  if(!muscles.length){a=autoMuscles();muscles=a.m;title=title||a.title;why=why||a.why}
  const N=Math.min(14,Math.max(Math.round(S.p.minutes/6.5),Math.min(muscles.length,8),3));
  const used=new Set(),items=[],missing=[];
  let k=0,guard=0;
  while(items.length<N&&guard++<80){
    const m=muscles[k%muscles.length];k++;
    const c=cands(m,used);
    if(c.length){used.add(c[0].id);items.push(mk(c[0],m))}
    else{if(missing.indexOf(m)<0)missing.push(m);if(missing.length>=muscles.length)break}
  }
  const rank=it=>{const e=EXI[it.id];return CORE.indexOf(it.target)>-1||e.mode==='t'?2:(e.s.length?0:1)};
  items.sort((x,y)=>rank(x)-rank(y));
  return{title:title||'Tu entrenamiento',why:why||'',muscles:muscles.slice(),items,missing};
}
function minutesOf(items){return Math.max(5,Math.round(items.reduce((s,it)=>s+it.sets*(40+it.rest),0)/60))}
function groupMuscles(ms){
  if(ms.length<=5)return ms.map(m=>[m]);
  const g=[[],[],[],[],[]];ms.forEach((m,i)=>g[i%5].push(m));return g;
}
/* Arma varias rutinas: una por músculo elegido (o tres enfoques si es un solo músculo), con al menos 3 ejercicios por músculo */
function buildPlan(muscles){
  let why='';
  if(!muscles.length){const a=autoMuscles();muscles=a.m;why=a.why}
  const objs=S.p.objs&&S.p.objs.length?S.p.objs:['musculo'];
  let defs;
  if(muscles.length>=2){
    defs=groupMuscles(muscles).map((g,i)=>({ms:g,gk:objs[0],fins:objs.slice(1),title:'Rutina '+(i+1)+' · '+g.map(m=>MUS[m]).join(' y ')}));
  }else{
    const ks=objs.slice();
    ['musculo','fuerza','grasa'].forEach(k=>{if(ks.length<3&&ks.indexOf(k)<0)ks.push(k)});
    defs=ks.slice(0,Math.max(3,objs.length)).map((k,i)=>({ms:[muscles[0]],gk:k,fins:[],title:'Rutina '+(i+1)+' · '+MUS[muscles[0]]+' · '+GOALS[k].n}));
  }
  const usedPlan=new Set();
  const routines=defs.map(d=>{
    const local=new Set(),items=[],short=[];
    const others=muscles.filter(m=>d.ms.indexOf(m)<0);
    const take=m=>{
      let c=cands(m,new Set(Array.from(usedPlan).concat(Array.from(local))));
      if(!c.length)c=cands(m,local);
      if(!c.length)return false;
      local.add(c[0].id);usedPlan.add(c[0].id);items.push(mk(c[0],m,d.gk));return true;
    };
    d.ms.forEach(m=>{let n=0;while(n<3&&take(m))n++;if(n<3)short.push(MUS[m]+': solo hay '+n+(n===1?' opción':' opciones')+' con tu equipo y tus limitaciones.')});
    const extra=3*d.ms.length;let added=0,guard=0;
    while(minutesOf(items)<S.p.minutes&&items.length<16&&guard++<60){
      const m=added<extra?d.ms[added%d.ms.length]:others[(added-extra)%Math.max(1,others.length)];
      if(m==null)break;
      take(m);added++;
    }
    const rank=it=>{const e=EXI[it.id];return CORE.indexOf(it.target)>-1||e.mode==='t'?2:(e.s.length?0:1)};
    items.sort((x,y)=>rank(x)-rank(y));
    d.fins.forEach((k,j)=>{const ix=items.length-1-j;if(ix>=0&&items.length>d.fins.length)Object.assign(items[ix],rx(EXI[items[ix].id],k),{fin:k})});
    let g2=0;while(minutesOf(items)>S.p.minutes*1.1&&g2++<60){const c=items.filter(it=>it.sets>2).sort((a,b)=>b.sets-a.sets)[0];if(!c)break;c.sets--}
    return{title:d.title,focus:d.ms.slice(),gk:d.gk,items,short};
  }).filter(r=>r.items.length);
  return{routines,muscles:muscles.slice(),why,objs:objs.slice()};
}

function chartSVG(pts){
  const W=320,H=150,l=46,r=14,t=14,b=26;
  const ws=pts.map(p=>p.w);let lo=Math.min.apply(null,ws),hi=Math.max.apply(null,ws);

  const Y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));

  const path=pts.map((p,i)=>(i?'L':'M')+f(X(i))+' '+f(Y(p.w))).join(' ');

  <line x1="${l}" x2="${W-r}" y1="${f(Y(hi))}" y2="${f(Y(hi))}" stroke="var(--line)"/><line x1="${l}" x2="${W-r}" y1="${f(Y(lo))}" y2="${f(Y(lo))}" stroke="var(--line)"/>
  <text x="${l-6}" y="${f(Y(hi)+4)}" text-anchor="end">${hi} kg</text><text x="${l-6}" y="${f(Y(lo)+4)}" text-anchor="end">${lo} kg</text>
  <path d="${path}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${f(X(i))}" cy="${f(Y(p.w))}" r="${i===pts.length-1?5:3.5}" fill="var(--orange-btn)"/>`).join('')}
  <text x="${l}" y="${H-6}">${pts[0].date}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${pts[pts.length-1].date}</text></svg>`;
}

      <span class="lbl">Registro (opcional)</span><div class="grid2"><div class="fl"><label for="lg-w">Peso usado (kg)</label><input class="field" id="lg-w" data-lg="w" inputmode="decimal" placeholder="${lastLog(e.id)?lastLog(e.id).w+' la última vez':'Ej.: 20'}" value="${esc(r.log[r.i].w)}"></div><div class="fl"><label for="lg-r">${e.mode==='t'?'Segundos logrados':'Repeticiones por serie'}</label><input class="field" id="lg-r" data-lg="r" inputmode="numeric" value="${esc(r.log[r.i].r)}"></div></div>

  if(L.t==='done'){

      <h2 style="font-size:28px">¡Sesión completada!</h2>
      <p class="sub" style="font-size:16px;margin:10px 0 20px">Trabajaste ${L.muscles.map(m=>MUS[m].toLowerCase()).join(', ')}. Llevas ${w.done} ${w.done===1?'sesión':'sesiones'} esta semana${w.planned?' de '+w.planned+' planeadas':''}.</p>
      <button class="btn" data-a="closeall">Volver al inicio</button></div></div>`;
  }
  if(L.t==='edit'){
    const E=L.e;
    return `<div class="layer sheet" style="z-index:${z}"><div class="panel" role="dialog" aria-label="Editar ${DAYS[E.d]}">
      <div class="row"><h2 class="grow" style="font-size:22px">${DAYS[E.d]}</h2><button class="back" data-a="pop" aria-label="Cerrar">×</button></div>
      <span class="lbl">Ese día</span>${seg('edrest',[[0,'Entreno'],[1,'Descanso']],E.rest?1:0)}

      <span class="lbl">Músculos</span><div class="chips">${MK.map(m=>`<button class="chip" data-a="edm" data-m="${m}" aria-pressed="${E.m.indexOf(m)>-1}">${MUS[m]}</button>`).join('')}</div>`}
      <button class="btn" style="margin-top:18px" data-a="saveday">Guardar día</button>
    </div></div>`;
  }
  if(L.t==='rt'){
    const r=L.r;
    return `<div class="layer" style="z-index:${z}"><div class="page">
      <div class="bar-top"><button class="back" data-a="pop" aria-label="Volver">‹</button><h2 class="grow" style="font-size:22px">${L.isNew?'Nueva rutina':'Editar rutina'}</h2></div>
      <div class="card"><div class="fl"><label for="rt-name">Nombre de la rutina</label><input class="field" id="rt-name" data-rt="name" value="${esc(r.name)}" placeholder="Ej.: Pecho y tríceps en casa"></div></div>
      ${r.items.length?r.items.map((it,i)=>{const e=EXI[it.id];return `<div class="li" style="flex-wrap:wrap">${thumbE(e)}<div class="grow"><h3>${esc(e.n)}</h3><div class="meta">${MUS[e.p]}</div></div><button class="ibtn" data-a="mvrt" data-i="${i}" data-v="-1" aria-label="Subir ${esc(e.n)}"${i===0?' disabled style="opacity:.3"':''}>↑</button><button class="ibtn" data-a="mvrt" data-i="${i}" data-v="1" aria-label="Bajar ${esc(e.n)}"${i===r.items.length-1?' disabled style="opacity:.3"':''}>↓</button><button class="ibtn" data-a="rmrt" data-i="${i}" aria-label="Quitar ${esc(e.n)}">×</button><div class="grid2" style="width:100%"><div class="fl"><label for="rs${i}">Series</label><input class="field" id="rs${i}" data-rt="sets" data-i="${i}" type="number" min="1" max="10" inputmode="numeric" value="${esc(it.sets)}"></div><div class="fl"><label for="rr${i}">${e.mode==='t'?'Tiempo':'Repeticiones'}</label><input class="field" id="rr${i}" data-rt="reps" data-i="${i}" value="${esc(it.reps)}"></div></div></div>`}).join(''):'<p class="empty">Agrega tu primer ejercicio.</p>'}
      <div class="stack" style="margin-top:12px"><button class="btn alt" data-a="pickex">Agregar ejercicio</button><button class="btn" data-a="savert">Guardar rutina</button></div>

      <div id="picklist">${pickItems(L)}</div>
    </div></div>`;

  return '';
}
function renderLayers(){
  const st=[].map.call(document.querySelectorAll('#layers .layer'),l=>l.scrollTop);
  $('#layers').innerHTML=ui.layers.map(layerHTML).join('');
  [].forEach.call(document.querySelectorAll('#layers .layer'),(l,i)=>{if(st[i])l.scrollTop=st[i]});
  document.body.style.overflow=ui.layers.length?'hidden':'';
}
const fmt=s=>String(Math.floor(s/60)).padStart(1,'0')+':'+String(s%60).padStart(2,'0');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}
function openSession(s){
  ui.layers=ui.layers.filter(l=>l.t!=='session');
  ui.layers.push({t:'session',s,seed:s.muscles.slice(),fixed:s.fixed});
  renderLayers();
}
function stopTimer(){if(ui.run&&ui.run.tm){clearInterval(ui.run.tm);ui.run.tm=null}}
function startRest(sec){
  const r=ui.run;stopTimer();r.left=sec;
  r.tm=setInterval(()=>{
    r.left--;
    const el=$('#rest');if(el)el.textContent=fmt(Math.max(0,r.left));
    if(r.left<=0){stopTimer();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){};renderLayers()}
  },1000);
}

/* ================= Acciones ================= */
function act(a,el){
  const d=el.dataset;
  switch(a){
    case 'tab':ui.tab=d.t;window.scrollTo(0,0);render();break;
    case 'view':ui.view=d.v;render();break;
    case 'mus':case 'musc':{
      const i=S.sel.indexOf(d.m);if(i>-1)S.sel.splice(i,1);else S.sel.push(d.m);
      save();render();break;}
    case 'clearsel':S.sel=[];save();render();break;
    case 'eq':{const i=S.p.equip.indexOf(d.k);if(i>-1)S.p.equip.splice(i,1);else S.p.equip.push(d.k);save();render();break;}
    case 'lim':{const i=S.p.limits.indexOf(d.k);if(i>-1)S.p.limits.splice(i,1);else S.p.limits.push(d.k);save();render();break;}
    case 'level':S.p.level=+d.v;save();render();break;
    case 'minutes':S.p.minutes=+d.v;ui.customT=false;save();render();break;
    case 'goal':{const o=S.p.objs,i=o.indexOf(d.k);if(i>-1){if(o.length===1){toast('Deja al menos un objetivo.');break}o.splice(i,1)}else o.push(d.k);S.p.goal=o[0];save();render();break;}
    case 'days':S.p.days=+d.v;save();render();break;
    case 'recommend':{const P=buildPlan(S.sel.slice());if(!P.routines.length){toast('No hay ejercicios con tu equipo y limitaciones. Marca más equipo.');break}openMulti(P);break;}
    case 'detail':ui.layers.push({t:'detail',id:d.id});renderLayers();break;
    case 'pop':case 'closeL':{
      if(a==='closeL'&&el!==event.target)break;
      const top=ui.layers[ui.layers.length-1];
      if(top&&top.t==='run'){break}
      ui.layers.pop();renderLayers();break;}
    case 'closeall':stopTimer();ui.run=null;ui.layers=[];renderLayers();render();break;
    case 'swap':{
      const L=ui.layers.filter(l=>l.t==='session')[0],s=L.s,i=+d.i,cur=s.items[i];
      const used=new Set(s.items.map(x=>x.id));
      const c=cands(cur.target,used);
      if(!c.length){toast('No hay otra opción con tu equipo. Marca más equipo en Inicio.');break}
      s.items[i]=mk(c[0],cur.target);renderLayers();break;}
    case 'regen':{
      const L=ui.layers.filter(l=>l.t==='session')[0];
      openSession(buildSession(L.s.muscles.slice(),L.s.title,L.s.why));break;}
    case 'startrun':{
      const L=ui.layers.filter(l=>l.t==='session')[0];
      ui.run={items:L.s.items.map(x=>Object.assign({},x)),i:0,done:L.s.items.map(x=>Array(x.sets).fill(false)),left:0,tm:null,title:L.s.title,log:L.s.items.map(()=>({w:'',r:''}))};
      ui.layers.push({t:'run'});renderLayers();break;}
    case 'set':{
      const r=ui.run,k=+d.k;r.done[r.i][k]=!r.done[r.i][k];
      if(r.done[r.i][k]){
        const last=r.i===r.items.length-1&&r.done[r.i].every(Boolean);
        if(!last)startRest(r.items[r.i].rest);
      }else{stopTimer();r.left=0}
      renderLayers();break;}
    case 'next':stopTimer();ui.run.left=0;ui.run.i++;renderLayers();break;
    case 'prev':stopTimer();ui.run.left=0;ui.run.i--;renderLayers();break;
    case 'skip':stopTimer();ui.run.left=0;renderLayers();break;
    case 'exitrun':
      if(confirmExit()){stopTimer();ui.run=null;ui.layers=ui.layers.filter(l=>l.t!=='run');renderLayers()}
      break;
    case 'finish':{
      stopTimer();
      const r=ui.run,ms=[];r.items.forEach(x=>{if(ms.indexOf(x.target)<0)ms.push(x.target)});
      S.history.push({d:new Date().toISOString(),muscles:ms,n:r.items.length,name:r.title,sets:r.done.reduce((t,a)=>t+a.filter(Boolean).length,0),items:r.items.map((x,i)=>({id:x.id,sets:r.done[i].filter(Boolean).length,w:parseFloat(String(r.log[i].w).replace(',','.'))||0,r:String(r.log[i].r||'')}))});
      S.history=S.history.slice(-120);save();
      ui.run=null;ui.layers=[{t:'done',muscles:ms}];renderLayers();render();break;}
    case 'genplan':ui.layers=ui.layers.filter(l=>l.t!=='plans');ui.layers.push({t:'plans',o:genPlans()});renderLayers();break;
    case 'useplan':{const L=ui.layers.filter(l=>l.t==='plans')[0];S.plan=L.o[+d.i].plan;save();ui.layers=ui.layers.filter(l=>l.t!=='plans');renderLayers();render();toast('Plan aplicado. Ajusta cualquier día con el lápiz.');break;}
    case 'planday':{
      const p=S.plan[+d.d];if(!p)break;
      openSession(buildSession(p.muscles.slice(),p.name,`Es tu sesión de ${DAYS[+d.d].toLowerCase()}.`));break;}
    case 'editday':{
      const p=S.plan[+d.d];
      ui.layers.push({t:'edit',e:{d:+d.d,rest:!p,name:p?p.name:'Entrenamiento',m:p?p.muscles.slice():[]}});renderLayers();break;}
    case 'edrest':{const E=ui.layers[ui.layers.length-1].e;keepName(E);E.rest=d.v==='1';renderLayers();break;}
    case 'edm':{const E=ui.layers[ui.layers.length-1].e;keepName(E);const i=E.m.indexOf(d.m);if(i>-1)E.m.splice(i,1);else E.m.push(d.m);renderLayers();break;}
    case 'saveday':{
      const E=ui.layers[ui.layers.length-1].e;keepName(E);
      if(E.rest)S.plan[E.d]=null;
      else{
        if(!E.m.length){toast('Elige al menos un músculo para ese día.');break}
        S.plan[E.d]={name:(E.name||'Entrenamiento').trim()||'Entrenamiento',muscles:E.m.slice()};
      }
      save();ui.layers.pop();renderLayers();render();break;}
    case 'customt':ui.customT=true;render();break;
    case 'opengrp':ui.grp=d.g;ui.q='';window.scrollTo(0,0);render();break;
    case 'libback':ui.grp=null;window.scrollTo(0,0);render();break;
    case 'toggleR':{const L=ui.layers.filter(l=>l.t==='multi')[0];L.open[d.i]=!L.open[d.i];renderLayers();break;}
    case 'swapm':{
      const L=ui.layers.filter(l=>l.t==='multi')[0],r=L.p.routines[+d.r],i=+d.i,cur=r.items[i];
      const used=new Set();L.p.routines.forEach(x=>x.items.forEach(it=>used.add(it.id)));
      const c=cands(cur.target,used);
      if(!c.length){toast('No hay otra opción con tu equipo. Marca más equipo en Inicio.');break}
      const fin=cur.fin;
      r.items[i]=Object.assign(mk(c[0],cur.target,r.gk),fin?Object.assign(rx(c[0],fin),{fin}):{});
      renderLayers();break;}
    case 'startmulti':{
      const L=ui.layers.filter(l=>l.t==='multi')[0],r=L.p.routines[+d.i];
      ui.run={items:r.items.map(x=>Object.assign({},x)),i:0,done:r.items.map(x=>Array(x.sets).fill(false)),left:0,tm:null,title:r.title,log:r.items.map(()=>({w:'',r:''}))};
      ui.layers.push({t:'run'});renderLayers();break;}
    case 'savemulti':{
      const L=ui.layers.filter(l=>l.t==='multi')[0],r=L.p.routines[+d.i];
      S.routines.push({id:'r'+Date.now(),name:r.title,items:r.items.map(x=>({id:x.id,sets:x.sets,reps:x.reps}))});
      save();toast('Guardada en Rutinas.');break;}
    case 'regenm':{
      const L=ui.layers.filter(l=>l.t==='multi')[0];
      const p=buildPlan(L.p.muscles.slice());p.why=L.p.why;
      L.p=p;L.open={0:true};renderLayers();break;}
    case 'gohome':ui.tab='home';window.scrollTo(0,0);render();break;
    case 'duprt':{const r=S.routines.filter(x=>x.id===d.id)[0];if(!r)break;const c=JSON.parse(JSON.stringify(r));c.id='r'+Date.now();c.name=r.name+' (copia)';S.routines.splice(S.routines.indexOf(r)+1,0,c);save();render();toast('Rutina duplicada.');break;}
    case 'mvrt':{const rt=ui.layers.filter(l=>l.t==='rt')[0],i=+d.i,j=i+(+d.v);if(j<0||j>=rt.r.items.length)break;const a=rt.r.items;const t=a[i];a[i]=a[j];a[j]=t;renderLayers();break;}
    case 'newrt':ui.layers.push({t:'rt',isNew:true,r:{id:'r'+Date.now(),name:'',items:[]}});renderLayers();break;
    case 'editrt':{const r=S.routines.filter(x=>x.id===d.id)[0];if(r){ui.layers.push({t:'rt',isNew:false,r:JSON.parse(JSON.stringify(r))});renderLayers()}break;}
    case 'delrt':
      if(ui.cdel===d.id){S.routines=S.routines.filter(x=>x.id!==d.id);ui.cdel=null;save();render()}
      else{ui.cdel=d.id;render();toast('Toca otra vez para borrar la rutina.')}
      break;
    case 'startrt':{
      const r=S.routines.filter(x=>x.id===d.id)[0];if(!r)break;
      const rest=(GOALS[goalKey()]||GOALS.musculo).rest;
      const items=r.items.filter(it=>EXI[it.id]).map(it=>({id:it.id,target:EXI[it.id].p,sets:it.sets,reps:it.reps,rest}));
      if(!items.length){toast('La rutina está vacía. Edítala y agrega ejercicios.');break}
      const ms=[];items.forEach(x=>{if(ms.indexOf(x.target)<0)ms.push(x.target)});
      openSession({title:r.name,why:'Es tu rutina personalizada.',muscles:ms,items,missing:[],custom:true});break;}
    case 'pickex':ui.layers.push({t:'pick',q:'',m:''});renderLayers();break;
    case 'pickm':{const L=ui.layers[ui.layers.length-1];L.m=d.m;renderLayers();break;}
    case 'pickadd':{
      const rt=ui.layers.filter(l=>l.t==='rt')[0],L=ui.layers[ui.layers.length-1];
      const i=rt.r.items.findIndex(x=>x.id===d.id);
      if(i>-1)rt.r.items.splice(i,1);
      else{const e=EXI[d.id],g=GOALS[goalKey()]||GOALS.musculo;rt.r.items.push({id:e.id,sets:g.sets,reps:e.mode==='t'?[30,40,50][e.lv-1]+' s':g.reps})}
      $('#picklist').innerHTML=pickItems(L);break;}
    case 'rmrt':{const rt=ui.layers.filter(l=>l.t==='rt')[0];rt.r.items.splice(+d.i,1);renderLayers();break;}
    case 'savert':{
      const rt=ui.layers.filter(l=>l.t==='rt')[0],r=rt.r;
      if(!(r.name||'').trim()){toast('Ponle un nombre a la rutina.');break}
      if(!r.items.length){toast('Agrega al menos un ejercicio.');break}
      r.name=r.name.trim();
      const i=S.routines.findIndex(x=>x.id===r.id);
      if(i>-1)S.routines[i]=r;else S.routines.push(r);
      save();ui.layers=ui.layers.filter(l=>l.t!=='rt'&&l.t!=='pick');renderLayers();render();toast('Rutina guardada.');break;}
    case 'calprev':{const c=ui.cal;c.m--;if(c.m<0){c.m=11;c.y--}render();break;}
    case 'calnext':{const c=ui.cal;c.m++;if(c.m>11){c.m=0;c.y++}render();break;}
    case 'selday':ui.selDay=d.k;render();break;
    case 'progex':ui.progEx=el.value;render();break;
    case 'addgoal':addGoal();break;
    case 'goaldone':S.p.goals[+d.i].done=el.checked;save();render();break;
    case 'delgoal':S.p.goals.splice(+d.i,1);save();render();break;
  }
}
function keepName(E){const n=$('#ed-name');if(n)E.name=n.value}
function confirmExit(){return true}
function addGoal(){
  const inp=$('#newgoal');if(!inp)return;
  const t=inp.value.trim();if(!t){toast('Escribe la meta antes de agregarla.');return}
  S.p.goals.push({t:t.slice(0,120),done:false});save();render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.tagName==='INPUT')return;
  act(t.dataset.a,t);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mins'){const v=Math.max(10,Math.min(180,Math.round(+t.value)||S.p.minutes));S.p.minutes=v;save();render();return}
  if(t.matches&&(t.matches('input[type=checkbox][data-a]')||t.matches('select[data-a]')))act(t.dataset.a,t);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [role=button]')){e.preventDefault();act(e.target.dataset.a,e.target)}
  if(e.key==='Enter'&&e.target.id==='newgoal'){e.preventDefault();addGoal()}
  if(e.key==='Escape'&&ui.layers.length){const top=ui.layers[ui.layers.length-1];if(top.t!=='run'&&top.t!=='done'){ui.layers.pop();renderLayers()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){S.p[t.dataset.f]=t.value;save()}
  if(t.id==='mins'){const v=Math.round(+t.value);if(v>=10&&v<=180){S.p.minutes=v;save()}}
  if(t.id==='q'){ui.q=t.value;$('#liblist').innerHTML=libItems()}
  if(t.dataset&&t.dataset.rt){
    const L=ui.layers.filter(l=>l.t==='rt')[0];
    if(L){const k=t.dataset.rt;if(k==='name')L.r.name=t.value;else{const it=L.r.items[+t.dataset.i];if(it)it[k]=k==='sets'?Math.max(1,Math.min(10,+t.value||1)):t.value}}
  }
  if(t.id==='pick-q'){const L=ui.layers[ui.layers.length-1];L.q=t.value;$('#picklist').innerHTML=pickItems(L)}
  if(t.dataset&&t.dataset.lg&&ui.run){ui.run.log[ui.run.i][t.dataset.lg]=t.value}
});
render();
</script>
</body>
</html>
